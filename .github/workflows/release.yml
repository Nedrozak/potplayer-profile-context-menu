name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build or update (for example: v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Release tag is empty.' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout tag
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Checkout selected tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag must be '$expectedTag' for VERSION '$version'. Found '$env:RELEASE_TAG'."
          }

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          foreach ($file in @(
            'app/PotPlayer_Profiles_Setup.ps1',
            'app/PotPlayer_Profiles_Remove.ps1',
            'scripts/Build-Release.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              exit 1
            }
          }

      - name: Build release package
        shell: powershell
        run: ./scripts/Build-Release.ps1

      - name: Verify release archive
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $package = "PotPlayer-Profile-Context-Menu-v$version"
          $zip = "dist/$package.zip"
          $test = 'dist/_verify'
          if (Test-Path $test) { Remove-Item $test -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $test

          $expectedNames = @(
            '1.Setup_PotPlayer_Profiles.cmd',
            '2.Remove_PotPlayer_Profiles.cmd',
            'PotPlayer_Profiles_Setup.ps1',
            'PotPlayer_Profiles_Remove.ps1',
            'README.txt',
            'LICENSE'
          )
          foreach ($name in $expectedNames) {
            $file = "$test/$package/$name"
            if (-not (Test-Path -LiteralPath $file)) { throw "Release archive missing: $file" }
          }

          $actualNames = @(Get-ChildItem -LiteralPath "$test/$package" -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedSorted = @($expectedNames | Sort-Object)
          if (($actualNames -join "`n") -cne ($expectedSorted -join "`n")) {
            throw "Release archive contains unexpected files. Found: $($actualNames -join ', ')"
          }

      - name: Build release notes
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $lines = @(Get-Content CHANGELOG.md)
          $escapedVersion = [regex]::Escape($version)
          $start = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$escapedVersion(?:\s|$)") {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no section for version $version."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+') {
              $end = $i
              break
            }
          }

          if ($end -le ($start + 1)) {
            throw "CHANGELOG.md section for version $version is empty."
          }
          $section = @($lines[($start + 1)..($end - 1)])
          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[0])) {
            $section = @($section | Select-Object -Skip 1)
          }
          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[-1])) {
            $section = @($section | Select-Object -First ($section.Count - 1))
          }
          if ($section.Count -eq 0) {
            throw "CHANGELOG.md section for version $version is empty."
          }

          $notes = @($section)
          $notes += ''
          $notes += '### Download'
          $notes += ''
          $notes += "Download ``PotPlayer-Profile-Context-Menu-v$version.zip`` below."
          $notes += 'Use `SHA256SUMS.txt` to verify the download if desired.'

          $notesPath = 'dist/RELEASE_NOTES.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          Write-Host "Release notes prepared from CHANGELOG.md for v$version."

      - name: Create or update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = $env:RELEASE_TAG
          $zip = "dist/PotPlayer-Profile-Context-Menu-v$version.zip"
          $sums = 'dist/SHA256SUMS.txt'
          $notes = 'dist/RELEASE_NOTES.md'
          $title = $tag
          $repo = $env:GITHUB_REPOSITORY

          cmd /c "gh release view $tag --repo $repo >nul 2>nul"
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $tag $zip $sums --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title $title --notes-file $notes --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag $zip $sums --verify-tag --title $title --notes-file $notes --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
